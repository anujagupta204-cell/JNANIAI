<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jnana AI | Future Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --text-primary: #ffffff;
            --text-secondary: #a0a0ab;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --message-user: rgba(139, 92, 246, 0.2);
            --message-bot: rgba(255, 255, 255, 0.03);
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Outfit', sans-serif;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .light-theme {
            --bg-dark: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --glass: rgba(0, 0, 0, 0.03);
            --glass-border: rgba(0, 0, 0, 0.1);
            --glass-hover: rgba(0, 0, 0, 0.05);
            --message-user: rgba(139, 92, 246, 0.1);
            --message-bot: rgba(0, 0, 0, 0.02);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        #bg-video {
            width: 320px;
            height: 320px;
            object-fit: contain;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 30px var(--accent-glow));
        }

        body.initial-state #bg-video {
            width: 500px;
            height: 500px;
            top: 45%;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-dark) 90%);
            pointer-events: none;
            transition: background 0.3s ease;
        }

        body.initial-state .video-overlay {
            background: radial-gradient(circle at center, transparent 30%, var(--bg-dark) 100%);
        }

        .app-container {
            width: 90%;
            max-width: 900px;
            height: 85vh;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--card-shadow);
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body.initial-state .app-container {
            background: transparent;
            backdrop-filter: none;
            box-shadow: none;
            border: none;
            justify-content: center;
        }

        body.initial-state #chat-window {
            opacity: 0;
            pointer-events: none;
        }

        body.initial-state header {
            border-bottom: none;
        }

        header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 0 var(--accent-glow);
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 var(--accent-glow);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(139, 92, 246, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0);
            }
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            padding: 4px 10px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        #theme-toggle:hover {
            background: var(--glass-hover);
        }

        #theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .sun-icon {
            display: none;
        }

        .light-theme .sun-icon {
            display: block;
        }

        .light-theme .moon-icon {
            display: none;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        #chat-window::-webkit-scrollbar {
            width: 6px;
        }

        #chat-window::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--message-user);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--message-bot);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.85rem;
            text-align: center;
        }

        #typing-indicator {
            align-self: flex-start;
            background: var(--message-bot);
            padding: 10px 15px;
            border-radius: 18px;
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .hidden {
            display: none !important;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: dot-wave 1.3s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot-wave {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        .initial-only {
            display: none;
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1s ease-out;
        }

        body.initial-state .initial-only {
            display: block;
        }

        .initial-only h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -1px;
        }

        .input-area {
            padding: 20px 30px 40px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.initial-state .input-area {
            margin-top: 100px;
            transform: translateY(0);
        }

        .input-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 16px 20px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        #chat-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #user-input {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 1.1rem;
            outline: none;
            padding: 8px 12px;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
        }

        .action-left,
        .action-right {
            display: flex;
            gap: 8px;
        }

        .action-btn,
        .voice-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .action-btn svg,
        .voice-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .action-btn span,
        .voice-btn span {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .action-btn:hover,
        .voice-btn:hover {
            background: var(--glass-hover);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .voice-btn {
            background: var(--message-bot);
        }

        @media (max-width: 768px) {
            .initial-only h1 {
                font-size: 1.8rem;
            }

            body.initial-state #bg-video {
                width: 400px;
                height: 400px;
            }

            .action-btn span,
            .voice-btn span {
                display: none;
            }

            .action-btn,
            .voice-btn {
                padding: 8px;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .app-container {
                width: 90%;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const messagesContainer = document.getElementById('messages');
            const typingIndicator = document.getElementById('typing-indicator');
            const deviceInfoBadge = document.getElementById('device-info');
            const themeToggle = document.getElementById('theme-toggle');
            const chatWindow = document.getElementById('chat-window');

            let chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];
            let localChatData = [];

            async function loadLocalDataset() {
                try {
                    const response = await fetch('chat_data.json');
                    if (response.ok) {
                        localChatData = await response.json();
                        console.log(`Loaded ${localChatData.length} records client-side.`);
                    }
                } catch (error) {
                    console.error('Failed to load local dataset:', error);
                }
            }

            function findBestMatch(prompt) {
                if (!localChatData || localChatData.length === 0) {
                    return "I'm sorry, I'm still gathering my thoughts. Please try again in a moment.";
                }

                const query = prompt.toLowerCase();
                let bestMatch = null;
                let highestScore = 0;

                for (const record of localChatData) {
                    let score = 0;
                    const question = (record.question || "").toLowerCase();

                    const words = query.split(/\s+/);
                    words.forEach(word => {
                        if (word.length > 2 && question.includes(word)) {
                            score++;
                        }
                    });

                    if (question === query) score += 10;
                    else if (question.startsWith(query)) score += 5;

                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = record.answer;
                    }
                }

                return bestMatch || "I couldn't find a specific answer for that in my local records. Can you try rephrasing?";
            }

            function detectDevice() {
                const ua = navigator.userAgent;
                const width = window.innerWidth;
                let device = 'Desktop';

                if (/mobile/i.test(ua)) {
                    device = 'Mobile';
                } else if (/tablet|ipad/i.test(ua)) {
                    device = 'Tablet';
                } else if (width <= 480) {
                    device = 'Mobile';
                } else if (width <= 1024) {
                    device = 'Tablet';
                } else if (width <= 1440) {
                    device = 'Laptop';
                }

                deviceInfoBadge.textContent = device;
                document.body.setAttribute('data-device', device.toLowerCase());
            }

            function initTheme() {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                document.body.className = savedTheme + '-theme';
            }

            themeToggle.addEventListener('click', () => {
                const isDark = document.body.classList.contains('dark-theme');
                const newTheme = isDark ? 'light' : 'dark';
                document.body.className = newTheme + '-theme';
                localStorage.setItem('theme', newTheme);
            });

            function appendMessage(role, text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role}`;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'content';
                contentDiv.textContent = text;

                msgDiv.appendChild(contentDiv);
                messagesContainer.appendChild(msgDiv);

                chatWindow.scrollTo({
                    top: chatWindow.scrollHeight,
                    behavior: 'smooth'
                });
            }

            function showTyping() {
                typingIndicator.classList.remove('hidden');
                chatWindow.scrollTo({
                    top: chatWindow.scrollHeight,
                    behavior: 'smooth'
                });
            }

            function hideTyping() {
                typingIndicator.classList.add('hidden');
            }

            function speakGreeting() {
                if (!window.speechSynthesis) return;
                const utterance = new SpeechSynthesisUtterance("Hello, OM NAMAH SHIVAYA");
                utterance.rate = 0.9;
                utterance.pitch = 1;
                window.speechSynthesis.speak(utterance);
            }

            function checkInitialState() {
                if (chatHistory.length === 0) {
                    document.body.classList.add('initial-state');
                    speakGreeting();
                } else {
                    document.body.classList.remove('initial-state');
                }
            }

            loadLocalDataset();

            async function handleChat(e) {
                e.preventDefault();
                const text = userInput.value.trim();
                if (!text) return;

                if (document.body.classList.contains('initial-state')) {
                    document.body.classList.remove('initial-state');
                }

                appendMessage('user', text);
                userInput.value = '';

                chatHistory.push({ role: 'user', text });
                saveHistory();

                showTyping();

                // Wait 500ms for "thinking" effect
                setTimeout(() => {
                    hideTyping();
                    const response = findBestMatch(text);
                    typeResponse(response);
                }, 500);
            }

            function typeResponse(text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message bot';
                const contentDiv = document.createElement('div');
                contentDiv.className = 'content';
                msgDiv.appendChild(contentDiv);
                messagesContainer.appendChild(msgDiv);

                let i = 0;
                const interval = setInterval(() => {
                    contentDiv.textContent += text[i];
                    i++;
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                    if (i >= text.length) {
                        clearInterval(interval);
                        chatHistory.push({ role: 'bot', text });
                        saveHistory();
                    }
                }, 15);
            }

            function saveHistory() {
                localStorage.setItem('chatHistory', JSON.stringify(chatHistory.slice(-50)));
            }

            function loadHistory() {
                chatHistory.forEach(msg => {
                    appendMessage(msg.role, msg.text);
                });
                checkInitialState();

                if (chatHistory.length === 0) {
                    const playAudioOnce = () => {
                        if (!window.speechSynthesis.speaking) {
                            speakGreeting();
                        }
                        document.body.removeEventListener('click', playAudioOnce);
                        document.body.removeEventListener('keydown', playAudioOnce);
                    };
                    document.body.addEventListener('click', playAudioOnce);
                    document.body.addEventListener('keydown', playAudioOnce);
                }
            }

            document.querySelectorAll('.action-btn, .voice-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const action = btn.getAttribute('title');
                    if (action === 'Voice') {
                        speakGreeting();
                    } else {
                        appendMessage('system', `${action} feature coming soon...`);
                    }
                });
            });

            detectDevice();
            initTheme();
            loadHistory();
            window.addEventListener('resize', detectDevice);
            chatForm.addEventListener('submit', handleChat);
        });
    </script>
</body>

</html>
